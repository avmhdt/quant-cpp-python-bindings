name: release

# FR-23. Only the owner pushes v* tags (tag ruleset, P-13), and the pypi environment needs the
# owner's approval (D-06). No tokens: TestPyPI and PyPI use Trusted Publishing (OIDC).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-install-project
      - name: Tag, version, changelog and licence agree (AC-W-12)
        run: uv run --no-sync python -m tools.qkdev release check --tag "$GITHUB_REF_NAME"
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  wheels:
    needs: check
    uses: ./.github/workflows/wheels.yml

  publish-testpypi:
    needs: [check, wheels]
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - run: rm -f dist/*.json && ls -l dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-smoke:
    # The release gate: install from TestPyPI on three OSes and run the smoke test.
    needs: [check, publish-testpypi]
    name: testpypi-smoke (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install from TestPyPI (retries while the index catches up)
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            uv run --no-project --with numpy --with typer --with pydantic-settings python -m tools.qkdev \
              release smoke --index testpypi --version "${{ needs.check.outputs.version }}" && exit 0
            sleep 30
          done
          exit 1

  publish-pypi:
    needs: [check, testpypi-smoke]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - run: rm -f dist/*.json && ls -l dist
      # PEP 740 attestations are on by default with Trusted Publishing.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  pypi-smoke:
    # AC-W-01: pip install from PyPI on the three OSes (aarch64 Linux too).
    needs: [check, publish-pypi]
    name: pypi-smoke (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install from PyPI (retries while the index catches up)
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            uv run --no-project --with numpy --with typer --with pydantic-settings python -m tools.qkdev \
              release smoke --index pypi --version "${{ needs.check.outputs.version }}" && exit 0
            sleep 30
          done
          exit 1

  github-release:
    needs: [check, publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Release with the CHANGELOG section as its body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --with numpy --with typer --with pydantic-settings python -m tools.qkdev \
            release notes --version "${{ needs.check.outputs.version }}" --output notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "qkern $GITHUB_REF_NAME" --notes-file notes.md

  docs:
    needs: publish-pypi
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
