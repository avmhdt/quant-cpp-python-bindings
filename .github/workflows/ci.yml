name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HYPOTHESIS_PROFILE: ci
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install clang tools and Ninja
        run: bash .github/scripts/apt-install.sh ninja-build clang-18 clang-format-18 clang-tidy-18
      - name: Python env (builds the extension)
        run: uv sync --locked
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy --strict src/qkern tests/python tools
      - name: Stubs up to date (FR-19)
        run: uv run python -m tools.qkdev stubs check
      - name: stubtest (AC-W-09)
        run: uv run python -m mypy.stubtest qkern._qkern --allowlist tests/stubtest_allowlist.txt
      - name: Docstring examples
        run: uv run pytest --doctest-modules src/qkern -p no:cacheprovider
      - name: Golden files (DQ-08)
        run: uv run python -m tools.qkdev fixtures golden
      - name: Fixtures byte-identical (DQ-09)
        run: uv run python -m tools.qkdev fixtures make --check
      - name: Data smoke test
        run: uv run python -m tools.qkdev data smoke
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror
      - name: clang-tidy (core, bindings, tests)
        run: |
          cmake --preset tidy -DQKERN_BUILD_PYTHON=ON -DPython_EXECUTABLE="$PWD/.venv/bin/python"
          cmake --build --preset tidy
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

  cpp:
    name: cpp (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc13, os: ubuntu-latest, preset: gcc13 }
          - { name: clang18, os: ubuntu-latest, preset: clang18 }
          - { name: appleclang, os: macos-latest, preset: dev }
          - { name: msvc, os: windows-latest, preset: msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/CPM
            build/cpm-cache
          key: cpm-${{ matrix.name }}-${{ hashFiles('tests/cpp/CMakeLists.txt', 'bench/cpp/CMakeLists.txt') }}
      - name: Install compilers and Ninja (Linux)
        if: runner.os == 'Linux'
        run: bash .github/scripts/apt-install.sh ninja-build g++-13 clang-18
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  python:
    name: python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - { os: ubuntu-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Python env (builds the extension)
        run: uv sync --locked
      - name: Build info
        run: uv run python -c "import qkern; qkern.show_config()"
      - name: pytest
        run: uv run pytest

  coverage:
    # NFR-09 / AC-W-03: C++ line coverage of include/qkern and src/bindings from the
    # GoogleTest run and the pytest run combined (gcovr), and Python branch coverage of
    # src/qkern (pytest-cov). Both gates are 90%.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCOVR: uvx gcovr==8.8 --gcov-executable gcov-13 --root . --filter include/qkern --filter src/bindings --exclude-throw-branches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/CPM
          key: cpm-coverage-${{ hashFiles('tests/cpp/CMakeLists.txt') }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: bash .github/scripts/apt-install.sh ninja-build g++-13
      - name: GoogleTest with --coverage
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
          ctest --preset coverage
          $GCOVR --json gtest.json "$HOME/build/quant-cpp-python-bindings/coverage"
      - name: Extension built with --coverage, then pytest with pytest-cov
        env:
          SKBUILD_CMAKE_BUILD_TYPE: Debug
          SKBUILD_BUILD_DIR: build/coverage-ext
          SKBUILD_CMAKE_ARGS: "-DCMAKE_CXX_COMPILER=g++-13;-DCMAKE_CXX_FLAGS=--coverage -fprofile-update=atomic -O0"
        run: |
          uv sync --locked
          uv run pytest --cov=qkern --cov-branch --cov-report=term-missing --cov-fail-under=90
          # nanobind's own sources lived in uv's temporary build environment; they are outside
          # the filters, so gcov failing to find them is ignored.
          $GCOVR --json pytest.json --gcov-ignore-errors=source_not_found             --gcov-ignore-errors=no_working_dir_found build/coverage-ext
      - name: Combined C++ gate (fail under 90% lines)
        run: |
          mkdir -p coverage-html
          $GCOVR --add-tracefile gtest.json --add-tracefile pytest.json --print-summary             --fail-under-line 90 --html-details coverage-html/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 14

  cpp-consumer:
    # FR-16: qkern::core through `cmake --install` + find_package, and through CPM.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/apt-install.sh ninja-build g++-13
      - name: Install qkern::core
        run: |
          cmake -S . -B build/core -G Ninja -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_BUILD_TYPE=Release
          cmake --install build/core --prefix "$RUNNER_TEMP/qkern-prefix"
          find "$RUNNER_TEMP/qkern-prefix" -type f | sort
      - name: Consumer via find_package
        run: |
          cmake -S examples/cpp_consumer -B build/consumer-fp -G Ninja -DCMAKE_CXX_COMPILER=g++-13             -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/qkern-prefix"
          cmake --build build/consumer-fp
          ctest --test-dir build/consumer-fp --output-on-failure
      - name: Consumer via CPM (this checkout)
        run: |
          cmake -S examples/cpp_consumer -B build/consumer-cpm -G Ninja -DCMAKE_CXX_COMPILER=g++-13             -DQKERN_CONSUMER_USE_CPM=ON -DCPM_qkern_SOURCE="$GITHUB_WORKSPACE"
          cmake --build build/consumer-cpm
          ctest --test-dir build/consumer-cpm --output-on-failure

  bench-smoke:
    # Informational: benchmarks at small sizes plus one `bench run --quick` + `bench report`
    # round trip into a temporary directory. Fails on errors only, never on timings.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QKERN_BENCH_MAX_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --group bench
      - run: uv run pytest bench/py/test_bench_smoke.py -p no:cacheprovider --benchmark-min-rounds=3

  ci:
    # Single required check for the main ruleset: passes only if every job above passed.
    if: always()
    needs: [lint, cpp, python, coverage, cpp-consumer, bench-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
