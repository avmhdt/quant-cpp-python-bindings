name: sanitizers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  asan:
    name: asan (ASan + UBSan, gtest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/CPM
          key: cpm-asan-${{ hashFiles('tests/cpp/CMakeLists.txt') }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build clang-18
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  asan-pytest:
    name: asan-pytest (ASan + UBSan, extension under pytest)
    # The extension is built with Clang 18 sanitizers and the Python test suite runs with the
    # ASan runtime preloaded. CPython itself is not instrumented, so leak detection is off
    # (Python's allocator caches would be reported); no suppressions are needed.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CC: clang-18
      CXX: clang++-18
      SKBUILD_CMAKE_BUILD_TYPE: RelWithDebInfo
      SKBUILD_BUILD_DIR: build/asan-ext
      SKBUILD_CMAKE_ARGS: "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer;-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined;-DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=address,undefined"
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build clang-18
      - run: uv sync --locked
      - name: pytest with the ASan runtime preloaded
        run: |
          export LD_PRELOAD="$(clang-18 -print-file-name=libclang_rt.asan-x86_64.so)"
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          .venv/bin/python -m pytest -p no:cacheprovider

  tsan:
    name: tsan (ThreadSanitizer, concurrency tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/CPM
          key: cpm-tsan-${{ hashFiles('tests/cpp/CMakeLists.txt') }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build clang-18
      # Runner kernels use high-entropy ASLR, which TSan's shadow memory layout cannot map.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: cmake --preset tsan
      - run: cmake --build --preset tsan
      - run: ctest --preset tsan -R concurrency

  sanitizers:
    # Single required check for the main ruleset.
    if: always()
    needs: [asan, asan-pytest, tsan]
    runs-on: ubuntu-latest
    steps:
      - name: All sanitizer jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
