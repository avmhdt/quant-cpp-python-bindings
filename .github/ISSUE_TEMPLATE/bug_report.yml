name: Bug report
description: Wrong result, crash or build failure
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A minimal example, the output you got and the output you expected.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: qkern.show_config()
      description: Paste the output of `python -c "import qkern; qkern.show_config()"`.
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, Python and NumPy versions
    validations:
      required: true
